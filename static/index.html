<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicalMind — Evidence Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --surface: #0f1628;
  --surface2: #141d35;
  --surface3: #1a2540;
  --border: rgba(99,140,255,0.12);
  --border-bright: rgba(99,140,255,0.3);
  --accent: #3d7fff;
  --accent2: #00e5c8;
  --accent3: #ff6b6b;
  --accent4: #ffd166;
  --text: #e8eef8;
  --text-dim: #8b9ab5;
  --text-faint: #4a5878;
  --grad1: linear-gradient(135deg, #3d7fff22, #00e5c822);
  --glow: 0 0 40px rgba(61,127,255,0.15);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-ui: 'Syne', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --r: 12px;
  --r-lg: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

/* ─── GRID LAYOUT ───────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 260px 1fr 340px;
  grid-template-rows: 64px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─── TOPBAR ────────────────────────────────── */
.topbar {
  grid-column: 1 / -1;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
  position: relative;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

.logo-text {
  font-family: var(--font-display);
  font-size: 1.3rem;
  color: var(--text);
  letter-spacing: -0.02em;
}

.logo-text span { color: var(--accent2); font-style: italic; }

.topbar-divider {
  width: 1px; height: 24px;
  background: var(--border);
}

.topbar-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.75rem; color: var(--text-dim);
  font-family: var(--font-mono);
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent2);
  box-shadow: 0 0 8px var(--accent2);
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 0.7rem;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.05em;
}

.badge-blue { background: rgba(61,127,255,0.15); color: var(--accent); border: 1px solid rgba(61,127,255,0.25); }
.badge-green { background: rgba(0,229,200,0.1); color: var(--accent2); border: 1px solid rgba(0,229,200,0.2); }
.badge-red { background: rgba(255,107,107,0.1); color: var(--accent3); border: 1px solid rgba(255,107,107,0.2); }
.badge-yellow { background: rgba(255,209,102,0.1); color: var(--accent4); border: 1px solid rgba(255,209,102,0.2); }

/* ─── SIDEBAR ───────────────────────────────── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-section {
  padding: 0 12px;
  margin-bottom: 8px;
}

.sidebar-label {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  letter-spacing: 0.12em;
  color: var(--text-faint);
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 6px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.85rem;
  color: var(--text-dim);
  border: 1px solid transparent;
  position: relative;
}

.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active {
  background: rgba(61,127,255,0.12);
  color: var(--accent);
  border-color: rgba(61,127,255,0.2);
}

.nav-item.active::before {
  content: '';
  position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
}

.nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: var(--accent3);
  color: white;
  font-size: 0.65rem;
  font-family: var(--font-mono);
  padding: 1px 6px;
  border-radius: 100px;
  font-weight: 600;
}

/* Recent queries */
.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 12px;
}

.recent-query {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 12px;
  margin: 0 8px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.78rem;
  color: var(--text-dim);
}
.recent-query:hover { background: var(--surface2); color: var(--text); }
.recent-query-icon { flex-shrink: 0; margin-top: 2px; opacity: 0.5; }
.recent-query-text { line-height: 1.4; }
.recent-query-time { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-faint); margin-top: 2px; }

/* ─── MAIN AREA ─────────────────────────────── */
.main {
  background: var(--bg);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Hero / Welcome screen */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
  text-align: center;
  min-height: 400px;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(61,127,255,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 50%, rgba(0,229,200,0.05) 0%, transparent 70%);
  pointer-events: none;
}

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--accent2);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

.hero-eyebrow::before, .hero-eyebrow::after {
  content: '';
  height: 1px; width: 40px;
  background: currentColor;
  opacity: 0.4;
}

.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 16px;
  letter-spacing: -0.03em;
}

.hero h1 em {
  font-style: italic;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: 1rem;
  color: var(--text-dim);
  max-width: 520px;
  line-height: 1.6;
  margin-bottom: 40px;
}

/* Quick scenarios */
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 640px;
}

.scenario-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  display: flex; gap: 12px;
}

.scenario-card:hover {
  border-color: var(--border-bright);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: var(--glow);
}

.scenario-emoji { font-size: 1.4rem; flex-shrink: 0; }
.scenario-title { font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.scenario-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }

/* ─── QUERY INPUT AREA ─────────────────────── */
.query-area {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  bottom: 0;
}

.query-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
}

.query-box:focus-within {
  border-color: var(--border-bright);
  box-shadow: 0 0 0 3px rgba(61,127,255,0.1);
}

.query-input-row {
  display: flex; align-items: flex-end; gap: 12px;
}

.query-textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 0.9rem;
  line-height: 1.5;
  resize: none;
  min-height: 40px;
  max-height: 120px;
}

.query-textarea::placeholder { color: var(--text-faint); }

.query-controls {
  display: flex; align-items: center; gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}

.urgency-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 5px 10px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
  letter-spacing: 0.03em;
}

.urgency-select option { background: var(--surface2); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-family: var(--font-ui);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  outline: none;
}

.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: #5490ff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(61,127,255,0.35); }
.btn-primary:active { transform: translateY(0); }

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-bright); }

.btn-icon {
  width: 36px; height: 36px;
  padding: 0;
  justify-content: center;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.btn-icon:hover { color: var(--text); border-color: var(--border-bright); background: var(--surface2); }

.query-hint {
  margin-left: auto;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-faint);
}

/* ─── RESPONSE FEED ─────────────────────────── */
.feed {
  flex: 1;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Query block */
.query-block {
  display: flex; justify-content: flex-end;
  animation: slide-in-right 0.3s ease;
}

@keyframes slide-in-right {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.query-bubble {
  background: rgba(61,127,255,0.15);
  border: 1px solid rgba(61,127,255,0.25);
  border-radius: 16px 16px 4px 16px;
  padding: 12px 16px;
  max-width: 80%;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
}

.query-meta {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-faint);
  margin-top: 4px;
  text-align: right;
}

/* Response block */
.response-block {
  animation: slide-in-left 0.4s ease;
}

@keyframes slide-in-left {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.response-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}

.ai-avatar {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.response-title { font-size: 0.82rem; color: var(--text-dim); }
.response-time { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-faint); margin-left: auto; }

/* Confidence ring */
.confidence-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  margin-bottom: 16px;
  display: flex; gap: 20px; align-items: center;
}

.confidence-ring-wrap {
  flex-shrink: 0;
  position: relative;
  width: 80px; height: 80px;
}

.confidence-ring-wrap svg {
  transform: rotate(-90deg);
}

.confidence-value {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

.confidence-pct {
  font-family: var(--font-mono);
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1;
}

.confidence-label {
  font-size: 0.6rem;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.confidence-info { flex: 1; }
.confidence-level {
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.evidence-bars {
  display: flex; flex-direction: column; gap: 5px;
}

.evidence-bar-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.72rem;
}

.evidence-bar-label { color: var(--text-dim); width: 130px; flex-shrink: 0; font-family: var(--font-mono); font-size: 0.68rem; }

.evidence-bar-track {
  flex: 1;
  height: 4px;
  background: var(--surface3);
  border-radius: 100px;
  overflow: hidden;
}

.evidence-bar-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 1s ease;
}

/* Recommendation card */
.rec-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 16px;
}

.rec-card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2);
}

.rec-card-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

.rec-card-title { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.rec-card-subtitle { font-size: 0.7rem; color: var(--text-dim); margin-top: 1px; }

.rec-card-body { padding: 20px; }

.rec-text {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--text);
}

.rec-text strong { color: var(--accent2); }
.rec-text em { color: var(--accent4); font-style: italic; }

/* Contradiction banner */
.contradiction-banner {
  background: rgba(255,107,107,0.08);
  border: 1px solid rgba(255,107,107,0.25);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex; gap: 12px;
}

.contradiction-icon { font-size: 1.2rem; flex-shrink: 0; }
.contradiction-title { font-size: 0.82rem; font-weight: 600; color: var(--accent3); margin-bottom: 6px; }
.contradiction-body { font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; }

/* Evidence citations */
.citations-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 16px;
}

.citations-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.78rem; font-weight: 600;
  background: var(--surface2);
}

.citation-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 14px;
  transition: background 0.15s;
  cursor: pointer;
}
.citation-item:last-child { border-bottom: none; }
.citation-item:hover { background: var(--surface2); }

.citation-num {
  width: 22px; height: 22px;
  background: var(--surface3);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}

.citation-content { flex: 1; }
.citation-title { font-size: 0.82rem; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
.citation-meta { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); }
.citation-relevance {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  margin-top: 4px;
  display: inline-flex; align-items: center; gap: 4px;
}

/* Reasoning steps */
.reasoning-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 16px;
}

.reasoning-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.78rem; font-weight: 600;
  background: var(--surface2);
  cursor: pointer;
  user-select: none;
}

.reasoning-steps { padding: 4px 0; }

.reasoning-step {
  display: flex; gap: 14px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.reasoning-step:last-child { border-bottom: none; }

.step-connector {
  display: flex; flex-direction: column; align-items: center;
  gap: 0; flex-shrink: 0;
}

.step-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 600;
  flex-shrink: 0;
}

.step-dot.completed { background: rgba(0,229,200,0.15); color: var(--accent2); border: 1px solid rgba(0,229,200,0.3); }
.step-dot.running { background: rgba(61,127,255,0.15); color: var(--accent); border: 1px solid rgba(61,127,255,0.3); animation: step-pulse 1s ease-in-out infinite; }
.step-dot.pending { background: var(--surface3); color: var(--text-faint); border: 1px solid var(--border); }

@keyframes step-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(61,127,255,0.3); }
  50% { box-shadow: 0 0 0 4px rgba(61,127,255,0); }
}

.step-line {
  width: 1px; flex: 1; min-height: 20px;
  background: var(--border);
  margin-top: 2px;
}

.step-content { flex: 1; }
.step-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; }
.step-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; }
.step-duration {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-faint);
  margin-top: 3px;
}

/* Typing indicator */
.typing-indicator {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  width: fit-content;
}

.typing-dots { display: flex; gap: 4px; }
.typing-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: typing 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-4px); opacity: 1; }
}

.typing-text { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); }

/* ─── RIGHT PANEL ───────────────────────────── */
.right-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.panel-section {
  border-bottom: 1px solid var(--border);
}

.panel-header {
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.78rem; font-weight: 700;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}

.panel-header svg { transition: transform 0.2s; }
.panel-header.collapsed svg { transform: rotate(-90deg); }

.panel-content { padding: 0 14px 14px; }

/* Live evidence feed */
.live-item {
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 8px;
  animation: live-pulse 0.4s ease;
}

@keyframes live-pulse {
  from { opacity: 0; transform: scale(0.98); border-color: var(--accent2); }
  to { opacity: 1; transform: scale(1); }
}

.live-item-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent2);
  flex-shrink: 0;
}

.live-item-title { font-size: 0.78rem; font-weight: 600; flex: 1; }
.live-item-type { font-size: 0.65rem; color: var(--text-faint); font-family: var(--font-mono); }
.live-item-excerpt { font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; }

/* Stats widgets */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 14px;
}

.stat-widget {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-label { font-size: 0.68rem; color: var(--text-dim); }

/* Pathway visualizer */
.pathway-viz {
  padding: 14px;
}

.pathway-node {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 6px;
  font-size: 0.75rem;
  transition: all 0.2s;
}

.pathway-node.active {
  border-color: var(--accent2);
  background: rgba(0,229,200,0.06);
}

.pathway-node-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.pathway-connector {
  display: flex; align-items: center;
  padding-left: 22px;
  margin-bottom: 6px;
}

.pathway-connector-line {
  width: 1px; height: 16px;
  background: var(--border);
  margin-left: 11px;
  position: relative;
}

.pathway-arrow {
  font-size: 0.6rem;
  color: var(--text-faint);
  padding: 0 6px;
}

/* Document upload zone */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--r);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin: 14px;
}

.upload-zone:hover {
  border-color: var(--border-bright);
  background: rgba(61,127,255,0.04);
}

.upload-icon { font-size: 1.8rem; margin-bottom: 8px; }
.upload-text { font-size: 0.78rem; color: var(--text-dim); }
.upload-hint { font-size: 0.68rem; color: var(--text-faint); font-family: var(--font-mono); }
